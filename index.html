<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/script.js"></script>
    <title>Unit Converter</title>
  </head>
  <body>
    <h2>Unit Converter</h2>
    <div class="category-tabs">
      <button>Temperature</button><button>Length</button><button>Mass</button
      ><button>Speed</button><button>Energy</button><button>Pressure</button>
    </div>
    <div class="converter">
      <div class="field-group">
        <label for="from-value">From</label>
        <div class="input-row">
          <input type="number" name="from-value" id="from-value" /><select
            name="cars"
            id="cars"
          >
            <option value="volvo">Volvo</option>
            <option value="saab">Saab</option>
            <option value="mercedes">Mercedes</option>
            <option value="audi">Audi</option>
          </select>
        </div>
      </div>
      <div class="field-group">
        <label for="to-value">To</label>
        <div class="input-row">
          <input type="number" name="to-value" id="to-value" /><select
            name="cars"
            id="cars"
          >
            <option value="volvo">Volvo</option>
            <option value="saab">Saab</option>
            <option value="mercedes">Mercedes</option>
            <option value="audi">Audi</option>
          </select>
        </div>
      </div>
    </div>
  </body>
</html>
